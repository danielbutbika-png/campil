# CI/CD for CampIL source (branch `source`): type check → unit tests → build → Firestore security-rules tests →
# browser scenarios → deploy the built site to `main` (GitHub Pages) ONLY if everything passed.
# Every deploy is tagged deploy-<date>-<commit>. Rollback: Actions → CI → Run workflow → ref = an older source commit.
# A short report of every run is committed to the `ci-reports` branch, so results can be read without the GitHub UI.
name: CI
on:
  push:
    branches: [source]
  workflow_dispatch:
    inputs:
      ref:
        description: 'source commit to build and deploy (empty = latest)'
        required: false
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - id: typecheck
        run: npm run typecheck 2>&1 | tee typecheck.log
        continue-on-error: true
      - id: unit
        run: npx vitest run --reporter=verbose 2>&1 | tee unit.log; exit ${PIPESTATUS[0]}
        shell: bash
        continue-on-error: true
      - id: build
        run: npx vite build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
        continue-on-error: true
      - id: rules
        run: npm run test:rules 2>&1 | tee rules.log; exit ${PIPESTATUS[0]}
        shell: bash
        continue-on-error: true
      - id: e2e
        name: browser scenarios
        shell: bash
        continue-on-error: true
        run: |
          npx playwright-core install --with-deps chromium > /dev/null 2>&1
          (npx vite preview --port 4173 > /dev/null 2>&1 &) ; sleep 4
          node scripts/run-e2e.mjs e2e-shots 2>&1 | tee e2e.log; exit ${PIPESTATUS[0]}
      - id: deploy
        name: deploy to GitHub Pages (main)
        if: steps.typecheck.outcome == 'success' && steps.unit.outcome == 'success' && steps.build.outcome == 'success' && steps.rules.outcome == 'success' && steps.e2e.outcome == 'success'
        shell: bash
        run: |
          set -e
          src=$(git rev-parse --short=7 HEAD); stamp=$(date -u +%Y%m%d-%H%M)
          git config user.name "campil-ci"; git config user.email "ci@campil.invalid"
          git fetch origin main
          git worktree add -B main site origin/main
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist/. site/
          cd site
          git add -A
          if git diff --cached --quiet; then echo "nothing to deploy" | tee ../deploy.log; exit 0; fi
          git commit -qm "Deploy ${src} (${stamp}) — all checks passed"
          git tag "deploy-${stamp}-${src}"
          git push origin main "deploy-${stamp}-${src}" 2>&1 | tee ../deploy.log
      - name: Report
        if: always()
        shell: bash
        run: |
          set +e
          sha=${GITHUB_SHA::7}
          {
            echo "# CI ${sha} — $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "- typecheck: ${{ steps.typecheck.outcome }}"
            echo "- unit: ${{ steps.unit.outcome }}"
            echo "- build: ${{ steps.build.outcome }}"
            echo "- rules: ${{ steps.rules.outcome }}"
            echo "- e2e: ${{ steps.e2e.outcome }}"
            echo "- deploy: ${{ steps.deploy.outcome }}"
            for f in typecheck unit build rules e2e deploy; do echo; echo "## $f"; echo '```'; tail -n 120 $f.log 2>/dev/null; echo '```'; done
          } > report.md
          git worktree remove --force site 2>/dev/null || true
          git fetch origin ci-reports:ci-reports 2>/dev/null || true
          mkdir -p /tmp/r && cp report.md /tmp/r/
          git config user.name "campil-ci"; git config user.email "ci@campil.invalid"
          if git rev-parse --verify ci-reports >/dev/null 2>&1; then git checkout ci-reports; else git checkout --orphan ci-reports; git rm -rqf . ; fi
          cp /tmp/r/report.md "latest.md"; cp /tmp/r/report.md "${sha}.md"
          git add latest.md "${sha}.md"; git commit -qm "CI ${sha}"; git push origin ci-reports
      - name: Fail if any check failed
        if: steps.typecheck.outcome != 'success' || steps.unit.outcome != 'success' || steps.build.outcome != 'success' || steps.rules.outcome != 'success' || steps.e2e.outcome != 'success' || steps.deploy.outcome == 'failure'
        run: exit 1
