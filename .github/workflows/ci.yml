# CI/CD for CampIL: type check → unit tests → build → Firestore security-rules tests → browser scenarios →
# deploy ONLY if everything passed. Branch `staging` → /campil/staging/ (separate Firebase project, separate device
# storage). Branch `source` → production /campil/. The two deploys never touch each other's files.
# Every deploy is tagged deploy-<date>-<commit>. Rollback: Actions → CI → Run workflow → ref = an older source commit.
# A short report of every run is committed to the `ci-reports` branch, so results can be read without the GitHub UI.
name: CI
on:
  push:
    branches: [source, staging]
  workflow_dispatch:
    inputs:
      ref:
        description: 'commit to build and deploy (empty = latest)'
        required: false
      target:
        description: 'production or staging'
        required: false
        default: production
permissions:
  contents: write
concurrency:
  group: campil-deploy   # staging and production deploys both write to `main`: one at a time
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - id: typecheck
        run: npm run typecheck 2>&1 | tee typecheck.log
        continue-on-error: true
      - id: unit
        run: npx vitest run --reporter=verbose 2>&1 | tee unit.log; exit ${PIPESTATUS[0]}
        shell: bash
        continue-on-error: true
      - id: build
        run: npx vite build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
        continue-on-error: true
      - id: rules
        run: npm run test:rules 2>&1 | tee rules.log; exit ${PIPESTATUS[0]}
        shell: bash
        continue-on-error: true
      - id: e2e
        name: browser scenarios
        shell: bash
        continue-on-error: true
        run: |
          npx playwright-core install --with-deps chromium > /dev/null 2>&1
          (npx vite preview --port 4173 > /dev/null 2>&1 &) ; sleep 4
          node scripts/run-e2e.mjs e2e-shots 2>&1 | tee e2e.log; exit ${PIPESTATUS[0]}
      - id: target
        shell: bash
        run: echo "name=$([ '${{ inputs.target }}' = staging ] || [ '${{ github.ref_name }}' = staging ] && echo staging || echo production)" >> "$GITHUB_OUTPUT"
      - id: stagingbuild
        name: build staging variant
        if: steps.target.outputs.name == 'staging'
        run: npx vite build --mode staging --outDir dist-staging --emptyOutDir 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - id: deploy
        name: deploy to GitHub Pages (main)
        if: steps.typecheck.outcome == 'success' && steps.unit.outcome == 'success' && steps.build.outcome == 'success' && steps.rules.outcome == 'success' && steps.e2e.outcome == 'success'
        shell: bash
        run: |
          set -e
          src=$(git rev-parse --short=7 HEAD); stamp=$(date -u +%Y%m%d-%H%M)
          git config user.name "campil-ci"; git config user.email "ci@campil.invalid"
          git fetch origin main
          git worktree add -B main site origin/main
          if [ "${{ steps.target.outputs.name }}" = staging ]; then
            rm -rf site/staging && mkdir -p site/staging && cp -r dist-staging/. site/staging/; env=staging
            node scripts/alerts/ims.mjs site/staging/live/ims-alerts.json || true   # snapshot of official warnings for testing
          else
            find site -mindepth 1 -maxdepth 1 ! -name .git ! -name staging ! -name live ! -name .github -exec rm -rf {} +
            cp -r dist/. site/; env=prod
            # `.github` on main holds the scheduled IMS-warnings job (installed from deploy/main, see docs/data/ALERTS.md); kept as is
            node scripts/alerts/ims.mjs site/live/ims-alerts.json || true
          fi
          cd site
          git add -A
          if git diff --cached --quiet; then echo "nothing to deploy" | tee ../deploy.log; exit 0; fi
          git commit -qm "Deploy ${env} ${src} (${stamp}) — all checks passed"
          git tag "deploy-${env}-${stamp}-${src}"
          git push origin main "deploy-${env}-${stamp}-${src}" 2>&1 | tee ../deploy.log
      - name: Report
        if: always()
        shell: bash
        run: |
          set +e
          sha=${GITHUB_SHA::7}
          {
            echo "# CI ${sha} — $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "- typecheck: ${{ steps.typecheck.outcome }}"
            echo "- unit: ${{ steps.unit.outcome }}"
            echo "- build: ${{ steps.build.outcome }}"
            echo "- rules: ${{ steps.rules.outcome }}"
            echo "- e2e: ${{ steps.e2e.outcome }}"
            echo "- deploy: ${{ steps.deploy.outcome }}"
            for f in typecheck unit build rules e2e deploy; do echo; echo "## $f"; echo '```'; tail -n 120 $f.log 2>/dev/null; echo '```'; done
          } > report.md
          git worktree remove --force site 2>/dev/null || true
          git config user.name "campil-ci"; git config user.email "ci@campil.invalid"
          # a separate worktree, so build outputs and logs in the checkout can't block switching branches
          if git fetch origin ci-reports 2>/dev/null; then git worktree add -f /tmp/rep FETCH_HEAD; cd /tmp/rep && git checkout -B ci-reports; else git worktree add -f --detach /tmp/rep && cd /tmp/rep && git checkout --orphan ci-reports && git rm -rqf . ; fi
          cp "$GITHUB_WORKSPACE/report.md" latest.md; cp "$GITHUB_WORKSPACE/report.md" "${sha}.md"
          git add latest.md "${sha}.md"; git commit -qm "CI ${sha}"; git push origin ci-reports
      - name: Fail if any check failed
        if: steps.typecheck.outcome != 'success' || steps.unit.outcome != 'success' || steps.build.outcome != 'success' || steps.rules.outcome != 'success' || steps.e2e.outcome != 'success' || steps.deploy.outcome == 'failure'
        run: exit 1
