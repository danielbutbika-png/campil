# Data refresh: fetch real places from Wikidata (CC0) and image licences from Wikimedia Commons, then write a
# coverage report. Triggered only by pushing the `data-refresh` branch (or manually). It deploys nothing:
# results are committed to the `ci-reports` branch under data/, and reviewed before they enter the app.
name: Data refresh
on:
  push:
    branches: [data-refresh]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wikidata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/alerts/ims.mjs /tmp/IMS.json && node -e "const d=require('/tmp/IMS.json');require('fs').writeFileSync('/tmp/IMS.md', JSON.stringify(d,null,1).slice(0,20000))" || true
      - run: node scripts/enrich/gazetteer.mjs /tmp/gazetteer.json 2>&1 | tee /tmp/log-gaz.txt
      - run: node scripts/enrich/wikidata.mjs /tmp/places.wd.json 2>&1 | tee /tmp/log.txt
        if: ${{ !contains(github.event.head_commit.message, '[quick]') }}
      - run: node scripts/enrich/osm.mjs /tmp/places.osm.json 2>&1 | tee -a /tmp/log.txt
        if: ${{ !contains(github.event.head_commit.message, '[quick]') }}
      - run: node scripts/enrich/merge.mjs /tmp/places.wd.json /tmp/places.osm.json /tmp/places.json /tmp/MERGE.md 2>&1 | tee -a /tmp/log.txt
        if: ${{ !contains(github.event.head_commit.message, '[quick]') }}
      - run: node scripts/enrich/coverage.mjs /tmp/places.json > /tmp/COVERAGE.md
        if: ${{ !contains(github.event.head_commit.message, '[quick]') }}
      - name: Save to ci-reports
        if: always()
        run: |
          git config user.name "CampIL data"; git config user.email "noreply@github.com"
          sha=$(git rev-parse --short HEAD)
          git fetch origin ci-reports && git worktree add -f /tmp/rep FETCH_HEAD && cd /tmp/rep && git checkout -B ci-reports
          mkdir -p data
          for f in log.txt log-gaz.txt gazetteer.json IMS.md places.wd.json places.osm.json places.json COVERAGE.md MERGE.md; do if [ -f /tmp/$f ]; then cp /tmp/$f data/; fi; done
          git add data && git commit -qm "data refresh ${sha}" && git push origin ci-reports
